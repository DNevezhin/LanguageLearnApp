<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Language App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #d9d9d9 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background-color: #f4f4f4 !important;
            border: 1px solid #ccc !important;
            border-radius: 4px !important;
            box-shadow: none !important;
        }

        .chat-box {
            height: 250px;
            overflow-y: auto;
            background: #eaeaea;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .msg-user {
            align-self: flex-end;
            background-color: #6c757d;
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
            max-width: 80%;
        }

        .msg-ai {
            align-self: flex-start;
            background-color: #ffffff;
            color: #333;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            max-width: 80%;
            border: 1px solid #ddd;
        }

        .btn-primary {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
        }

            .btn-primary:hover {
                background-color: #5a6268 !important;
            }

        .btn-success {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
        }

            .btn-success:hover {
                background-color: #5a6268 !important;
            }

        .btn-danger {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
        }

        .form-control:focus {
            border-color: #6c757d !important;
            box-shadow: 0 0 0 0.25rem rgba(108, 117, 125, 0.25) !important;
        }
    </style>
</head>
<body>

    <div id="authSection" class="container mt-5" style="max-width: 400px;">
        <div class="card">
            <div class="card-body">
                <h3 class="text-center mb-4">Вход</h3>
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" id="loginInput" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="passwordInput" class="form-control">
                </div>
                <button onclick="login()" class="btn btn-primary w-100">Войти</button>
                <div class="text-center mt-3">
                    <a href="#" onclick="showRegister()">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>

    <div id="registerSection" class="container mt-5 hidden" style="max-width: 400px;">
        <div class="card">
            <div class="card-body">
                <h3 class="text-center mb-4">Регистрация</h3>
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" id="regLoginInput" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="regPasswordInput" class="form-control">
                </div>
                <button onclick="register()" class="btn btn-success w-100">Зарегистрироваться</button>
                <div class="text-center mt-3">
                    <a href="#" onclick="showLogin()">Войти</a>
                </div>
            </div>
        </div>
    </div>

    <div id="mainSection" class="container-fluid hidden mt-3">
        <div class="row">
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Язык</h5>
                        <select id="languageSelect" class="form-select mb-3" onchange="loadLessons()">
                            <option value="">Загрузка...</option>
                        </select>
                        <h5 class="card-title">Уроки</h5>
                        <ul id="lessonsList" class="list-group"></ul>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card">
                    <div class="card-body">
                        <div id="noLessonSelected" class="text-center text-muted mt-5">
                            <h4>Выберите урок слева</h4>
                        </div>

                        <div id="lessonContent" class="hidden">
                            <h2 id="lessonTitle"></h2>
                            <div id="lessonTheory" class="alert alert-secondary"></div>

                            <h4>Задача</h4>
                            <p id="taskDescription" class="fw-bold"></p>
                            <input type="hidden" id="currentTaskId" value="">

                            <label class="form-label mt-3">Ваш код:</label>
                            <textarea id="codeInput" class="form-control font-monospace" rows="6" style="background: #2d2d2d; color: #f8f8f2;"></textarea>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <h4>Чат с ментором</h4>
                                <button onclick="clearChat()" class="btn btn-danger btn-sm">Очистить чат</button>
                            </div>

                            <div id="chatMessages" class="chat-box"></div>

                            <div class="input-group mb-3">
                                <input type="text" id="chatInput" class="form-control" placeholder="Задайте вопрос..." onkeypress="handleKeyPress(event)">
                                <button onclick="sendChatMessage()" class="btn btn-primary">Отправить</button>
                            </div>

                            <button onclick="checkCode()" class="btn btn-success">Проверить код через ИИ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
